name: GPX Maker targeted fix

on:
  push:
    branches:
      - gpxmaker-osm-landmark-fix

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply OSM map and landmark filtering fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpxmaker-osm-landmark-fix
      - name: Apply targeted patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gpxmaker/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Apply OSM map and landmark filtering fix'
          git push origin HEAD:gpxmaker-osm-landmark-fix
