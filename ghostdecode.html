<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPS Mock Route Decoder</title>
<style>
  :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { max-width: 900px; margin: 32px auto; padding: 0 16px; line-height: 1.45; }
  h1 { margin-bottom: 6px; }
  .muted { opacity: .72; }
  textarea { width: 100%; min-height: 140px; box-sizing: border-box; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  button { padding: 9px 14px; margin: 8px 8px 8px 0; cursor: pointer; }
  .card { border: 1px solid #ccc; border-radius: 10px; padding: 14px; margin: 16px 0; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 7px 8px; border-bottom: 1px solid #ddd; text-align: left; }
  code, pre { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  pre { white-space: pre-wrap; word-break: break-word; }
  .error { color: #b00020; white-space: pre-wrap; }
  .ok { color: #147a2e; }
  .hidden { display: none; }
</style>
</head>
<body>
<h1>GPS Mock Route Decoder</h1>

<label for="input"><strong>Shared text, share URL, or p= payload</strong></label>
<textarea id="input" placeholder="Paste the whole sharing message here, including either an Easy GPS Mock ?p= link or an AutoCool /p/ short link..."></textarea>

<div>
  <button id="decodeBtn">Decode route</button>
  <button id="csvBtn" disabled>Export CSV</button>
  <button id="gpxBtn" disabled>Export GPX</button>
</div>

<div id="status"></div>

<div id="metaCard" class="card hidden">
  <h2>Route metadata</h2>
  <table id="metaTable"></table>
</div>

<div id="coordsCard" class="card hidden">
  <h2>Coordinates</h2>
  <div>
    <button id="copyBtn" type="button">Copy to clipboard</button>
  </div>
  <textarea id="coords" readonly style="min-height: 320px;"></textarea>
</div>

<script>
const KEY_TEXT = "GhostRouteShareKey20260628AESGCM";
let lastDecoded = null;

function b64urlToBytes(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const bin = atob(s);
  return Uint8Array.from(bin, c => c.charCodeAt(0));
}

function findFirstUrl(input) {
  const m = input.match(/https?:\/\/[^\s<>"']+/i);
  return m ? m[0].replace(/[),.;!?，。；！？]+$/, "") : null;
}

function classifyInput(input) {
  input = input.trim();
  if (!input) throw new Error("Paste the shared text, share URL, or p= payload first.");

  // Any domain carrying an Easy GPS Mock-compatible ?p= payload.
  const paramMatch = input.match(/[?&]p=([A-Za-z0-9_-]+={0,2})(?=[&#\s<>"']|$)/i);
  if (paramMatch) return { type: "easy", payload: paramMatch[1] };

  // Raw p=... or bare Base64URL payload.
  const raw = input.replace(/^p\s*=\s*/i, "").trim();
  if (/^[A-Za-z0-9_-]+={0,2}$/.test(raw) && raw.length > 40) {
    return { type: "easy", payload: raw };
  }

  const urlText = findFirstUrl(input);
  if (urlText) {
    try {
      const u = new URL(urlText);
      const m = u.pathname.match(/\/p\/([A-Za-z0-9_-]+)\/?$/i);
      if (m) return { type: "autocool", code: m[1], url: u.href, origin: u.origin };
    } catch {}
  }

  throw new Error("No compatible share link or payload was found in the pasted text.");
}

async function gunzip(bytes) {
  if (!("DecompressionStream" in window)) {
    throw new Error("This browser does not support DecompressionStream. Try a current Chrome, Edge, Firefox, or Safari.");
  }
  const ds = new DecompressionStream("gzip");
  const out = await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
  return new Uint8Array(out);
}

function readVarint(buf, pos) {
  let x = 0n, shift = 0n;
  while (pos < buf.length) {
    const b = BigInt(buf[pos++]);
    x |= (b & 0x7fn) << shift;
    if ((b & 0x80n) === 0n) return { value: x, pos };
    shift += 7n;
    if (shift > 70n) throw new Error("Invalid varint");
  }
  throw new Error("Unexpected end of varint");
}

function parseProto(buf) {
  const fields = {};
  let pos = 0;
  while (pos < buf.length) {
    const tagRes = readVarint(buf, pos);
    const tag = Number(tagRes.value);
    pos = tagRes.pos;
    const fieldNo = tag >> 3;
    const wire = tag & 7;

    let value;
    if (wire === 0) {
      const r = readVarint(buf, pos);
      value = r.value;
      pos = r.pos;
    } else if (wire === 1) {
      if (pos + 8 > buf.length) throw new Error("Truncated fixed64");
      value = buf.slice(pos, pos + 8);
      pos += 8;
    } else if (wire === 2) {
      const r = readVarint(buf, pos);
      const len = Number(r.value);
      pos = r.pos;
      if (pos + len > buf.length) throw new Error("Truncated length-delimited field");
      value = buf.slice(pos, pos + len);
      pos += len;
    } else if (wire === 5) {
      if (pos + 4 > buf.length) throw new Error("Truncated fixed32");
      value = buf.slice(pos, pos + 4);
      pos += 4;
    } else {
      throw new Error(`Unsupported protobuf wire type ${wire}`);
    }
    (fields[fieldNo] ??= []).push({ wire, value });
  }
  return fields;
}

function bytesToUtf8(bytes) {
  return new TextDecoder("utf-8", { fatal: false }).decode(bytes);
}

function fixed32FloatLE(bytes) {
  return new DataView(bytes.buffer, bytes.byteOffset, 4).getFloat32(0, true);
}

function decodePolyline6(str) {
  const coords = [];
  let index = 0, lat = 0, lng = 0;
  while (index < str.length) {
    let result = 0, shift = 0, b;
    do {
      if (index >= str.length) throw new Error("Invalid encoded polyline");
      b = str.charCodeAt(index++) - 63;
      result |= (b & 0x1f) << shift;
      shift += 5;
    } while (b >= 0x20);
    const dlat = (result & 1) ? ~(result >> 1) : (result >> 1);
    lat += dlat;

    result = 0; shift = 0;
    do {
      if (index >= str.length) throw new Error("Invalid encoded polyline");
      b = str.charCodeAt(index++) - 63;
      result |= (b & 0x1f) << shift;
      shift += 5;
    } while (b >= 0x20);
    const dlng = (result & 1) ? ~(result >> 1) : (result >> 1);
    lng += dlng;

    coords.push([lat / 1e6, lng / 1e6]);
  }
  return coords;
}

function getField(fields, n) {
  return fields[n]?.[0] ?? null;
}

function formatEpochMs(v) {
  try {
    const n = Number(v);
    if (!Number.isFinite(n)) return String(v);
    return new Date(n).toLocaleString();
  } catch {
    return String(v);
  }
}

async function decodeEasyRoute(payload) {
  const compressed = b64urlToBytes(payload);
  const protoBytes = await gunzip(compressed);
  const fields = parseProto(protoBytes);

  const cipherField = getField(fields, 1);
  const nonceField = getField(fields, 2);
  if (!cipherField || cipherField.wire !== 2) throw new Error("Encrypted route field not found.");
  if (!nonceField || nonceField.wire !== 2) throw new Error("Nonce field not found.");

  const keyBytes = new TextEncoder().encode(KEY_TEXT);
  const key = await crypto.subtle.importKey("raw", keyBytes, { name: "AES-GCM" }, false, ["decrypt"]);

  let plainBuf;
  try {
    plainBuf = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: nonceField.value },
      key,
      cipherField.value
    );
  } catch {
    throw new Error("AES-GCM decryption failed. The app may have changed its share format or key.");
  }

  const encodedPolyline = bytesToUtf8(new Uint8Array(plainBuf));
  const coordinates = decodePolyline6(encodedPolyline);

  const metadata = {};
  const f3 = getField(fields, 3);
  const f4 = getField(fields, 4);
  const f5 = getField(fields, 5);
  const f6 = getField(fields, 6);
  const f7 = getField(fields, 7);
  const f8 = getField(fields, 8);
  const f9 = getField(fields, 9);
  const f10 = getField(fields, 10);

  if (f3?.wire === 5) metadata["Field 3"] = fixed32FloatLE(f3.value);
  if (f4?.wire === 0) metadata["Field 4"] = Number(f4.value);
  if (f5?.wire === 2) metadata["Mode"] = bytesToUtf8(f5.value);
  if (f6?.wire === 0) metadata["Expires"] = formatEpochMs(f6.value);
  if (f7?.wire === 0) metadata["Created"] = formatEpochMs(f7.value);
  if (f8?.wire === 0) metadata["Validity (seconds)"] = Number(f8.value);
  if (f9?.wire === 2) metadata["Route name"] = bytesToUtf8(f9.value);
  if (f10?.wire === 0) metadata["Field 10"] = Number(f10.value);
  metadata["Points"] = coordinates.length;

  return { metadata, coordinates, encodedPolyline };
}


function findRouteObject(value, depth = 0) {
  if (depth > 6 || value == null) return null;
  if (typeof value === "string") {
    const t = value.trim();
    if ((t.startsWith("{") && t.endsWith("}")) || (t.startsWith("[") && t.endsWith("]"))) {
      try { return findRouteObject(JSON.parse(t), depth + 1); } catch {}
    }
    return null;
  }
  if (Array.isArray(value)) return null;
  if (typeof value !== "object") return null;
  if (Array.isArray(value.route) || typeof value.route === "string") return value;
  for (const key of ["data", "result", "payload", "phantom", "routeData"]) {
    if (key in value) {
      const found = findRouteObject(value[key], depth + 1);
      if (found) return found;
    }
  }
  for (const v of Object.values(value)) {
    const found = findRouteObject(v, depth + 1);
    if (found) return found;
  }
  return null;
}

function routeToCoordinates(route) {
  if (typeof route === "string") {
    try { route = JSON.parse(route); }
    catch { throw new Error("AutoCool returned a route in an unknown format."); }
  }
  if (!Array.isArray(route)) throw new Error("AutoCool response does not contain a route array.");

  const out = [];
  for (const point of route) {
    let lat, lon;
    if (Array.isArray(point)) {
      const nums = point.filter(v => typeof v === "number" && Number.isFinite(v));
      if (nums.length >= 2) [lat, lon] = nums;
    } else if (point && typeof point === "object") {
      lat = point.lat ?? point.latitude;
      lon = point.lon ?? point.lng ?? point.longitude;
    } else if (typeof point === "string") {
      const m = point.match(/^\s*(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)\s*$/);
      if (m) { lat = Number(m[1]); lon = Number(m[2]); }
    }
    lat = Number(lat); lon = Number(lon);
    if (Number.isFinite(lat) && Number.isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180) {
      out.push([lat, lon]);
    }
  }
  if (!out.length) throw new Error("The AutoCool route was found, but its coordinate format was not recognized.");
  return out;
}

async function fetchJsonCandidate(url) {
  const r = await fetch(url, { method: "GET", redirect: "follow", cache: "no-store" });
  const text = await r.text();
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  try { return JSON.parse(text); } catch {
    // Some public share pages may embed the API JSON in HTML/script text.
    const candidates = text.match(/\{[\s\S]*\}/g) || [];
    for (const c of candidates) {
      try {
        const obj = JSON.parse(c);
        if (findRouteObject(obj)) return obj;
      } catch {}
    }
    throw new Error("Response was not compatible JSON.");
  }
}

async function decodeAutoCoolRoute(info) {
  const code = info.code;
  const attempts = [
    `${info.origin}/api/phantom/${encodeURIComponent(code)}`,
    `https://mushgo-control.coco394.workers.dev/api/phantom/${encodeURIComponent(code)}`,
    info.url
  ];
  let lastError = null;
  for (const url of [...new Set(attempts)]) {
    try {
      const json = await fetchJsonCandidate(url);
      const obj = findRouteObject(json);
      if (!obj) throw new Error("No route object found in response.");
      const coordinates = routeToCoordinates(obj.route);
      const metadata = {};
      const labels = {
        label: "Route name", pointCount: "Points", speedKmh: "Speed (km/h)",
        routingMode: "Routing mode", loopMode: "Loop mode", repeatCount: "Repeat count",
        executionStride: "Execution stride", simulationSeconds: "Simulation seconds"
      };
      for (const [key, label] of Object.entries(labels)) {
        if (obj[key] !== undefined && obj[key] !== null && obj[key] !== "") metadata[label] = obj[key];
      }
      if (obj.validUntil) metadata["Valid until"] = formatEpochMs(BigInt(obj.validUntil));
      if (obj.serverTime) metadata["Server time"] = formatEpochMs(BigInt(obj.serverTime));
      metadata["Points"] = coordinates.length;
      return { metadata, coordinates, source: "AutoCool" };
    } catch (e) { lastError = e; }
  }
  throw new Error(
    "AutoCool short code was recognized, but its route data could not be fetched. " +
    "The link may have expired, or the server may block requests from a local HTML file (CORS)." +
    (lastError?.message ? ` Last error: ${lastError.message}` : "")
  );
}

async function decodeAny(input) {
  const info = classifyInput(input);
  if (info.type === "easy") return decodeEasyRoute(info.payload);
  if (info.type === "autocool") return decodeAutoCoolRoute(info);
  throw new Error("Unsupported link type.");
}

function escapeXml(s) {
  return String(s).replace(/[<>&'"]/g, c => ({
    '<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','"':'&quot;'
  }[c]));
}

function download(name, content, type) {
  const blob = new Blob([content], { type });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function safeName(name) {
  return (name || "route").replace(/[\\/:*?"<>|]+/g, "_").trim() || "route";
}

document.getElementById("decodeBtn").addEventListener("click", async () => {
  const status = document.getElementById("status");
  const metaCard = document.getElementById("metaCard");
  const coordsCard = document.getElementById("coordsCard");
  const csvBtn = document.getElementById("csvBtn");
  const gpxBtn = document.getElementById("gpxBtn");

  status.className = "";
  status.textContent = "Decoding…";
  metaCard.classList.add("hidden");
  coordsCard.classList.add("hidden");
  csvBtn.disabled = true;
  gpxBtn.disabled = true;
  lastDecoded = null;

  try {
    const result = await decodeAny(document.getElementById("input").value);
    lastDecoded = result;

    const mt = document.getElementById("metaTable");
    mt.innerHTML = "";
    for (const [k, v] of Object.entries(result.metadata)) {
      const tr = document.createElement("tr");
      const th = document.createElement("th");
      const td = document.createElement("td");
      th.textContent = k;
      td.textContent = v;
      tr.append(th, td);
      mt.appendChild(tr);
    }

    document.getElementById("coords").value =
      result.coordinates.map(([lat,lng]) => `${lat.toFixed(6)},${lng.toFixed(6)}`).join("\n");

    metaCard.classList.remove("hidden");
    coordsCard.classList.remove("hidden");
    csvBtn.disabled = false;
    gpxBtn.disabled = false;
    status.className = "ok";
    status.textContent = `Decoded ${result.coordinates.length} points successfully.`;
  } catch (e) {
    status.className = "error";
    status.textContent = e?.message || String(e);
  }
});

document.getElementById("copyBtn").addEventListener("click", async () => {
  const box = document.getElementById("coords");
  const text = box.value;
  if (!text) return;

  const btn = document.getElementById("copyBtn");
  const original = btn.textContent;

  try {
    await navigator.clipboard.writeText(text);
    btn.textContent = "Copied!";
  } catch {
    box.focus();
    box.select();
    const ok = document.execCommand("copy");
    btn.textContent = ok ? "Copied!" : "Select all and copy";
  }

  setTimeout(() => {
    btn.textContent = original;
  }, 1500);
});

document.getElementById("csvBtn").addEventListener("click", () => {
  if (!lastDecoded) return;
  const rows = ["latitude,longitude", ...lastDecoded.coordinates.map(([a,b]) => `${a},${b}`)];
  const name = safeName(lastDecoded.metadata["Route name"]);
  download(`${name}.csv`, rows.join("\n"), "text/csv;charset=utf-8");
});

document.getElementById("gpxBtn").addEventListener("click", () => {
  if (!lastDecoded) return;
  const name = lastDecoded.metadata["Route name"] || "Easy GPS Mock route";
  const points = lastDecoded.coordinates
    .map(([lat,lon]) => `    <trkpt lat="${lat}" lon="${lon}"></trkpt>`)
    .join("\n");
  const gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Easy GPS Mock Route Decoder"
 xmlns="http://www.topografix.com/GPX/1/1">
  <trk>
    <name>${escapeXml(name)}</name>
    <trkseg>
${points}
    </trkseg>
  </trk>
</gpx>
`;
  download(`${safeName(name)}.gpx`, gpx, "application/gpx+xml;charset=utf-8");
});
</script>
</body>
</html>
